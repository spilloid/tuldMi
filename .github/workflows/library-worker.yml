name: Publish shared library worker
on:
  push:
    paths:
      - server/**
      - .github/workflows/library-worker.yml
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  packages: write
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Test account isolation, storage and playback
        run: |
          python -m pip install fastapi==0.115.12 python-multipart==0.0.20 'PyJWT[crypto]==2.10.1' httpx numpy
          python -m unittest discover -s server -v
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: image
        uses: docker/build-push-action@v6
        with:
          context: server
          push: true
          tags: ghcr.io/spilloid/tuldmi-worker:sha-${{ github.sha }}
      - name: Record image digest
        run: echo 'ghcr.io/spilloid/tuldmi-worker@${{ steps.image.outputs.digest }}' >> "$GITHUB_STEP_SUMMARY"
