name: macOS Apple Silicon
# Lint, test and bundle tuldMi for macOS on an arm64 runner. On a published release, attach the
# disk image and its SHA-256 to that release. The Windows installer is still built and signed
# locally (scripts/release.ps1, docs/RELEASE.md).
#
# The app is ad-hoc signed, not notarized (no Developer ID yet): Gatekeeper warns on first open
# and the release notes say so. Integrity is the published SHA-256.
on:
  pull_request:
  push:
    branches: [main]
  release:
    types: [published]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: macos-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    name: ARM64 clippy, tests, disk image
    runs-on: macos-15
    timeout-minutes: 75
    env:
      MACOSX_DEPLOYMENT_TARGET: '15.4'
      # rust-toolchain.toml pins the Windows MSVC host for local Windows builds; this env var
      # takes precedence over it.
      RUSTUP_TOOLCHAIN: stable
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - name: Require Apple Silicon
        run: test "$(uname -m)" = arm64
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
          targets: aarch64-apple-darwin
      - uses: Swatinem/rust-cache@v2
      # .cargo/config.toml points LIBCLANG_PATH (bindgen, whisper-rs-sys) at the Windows LLVM
      # install; [env] never overrides a variable that is already set, so use Xcode's here.
      - name: libclang from Xcode
        run: |
          dir="$(xcode-select -p)/Toolchains/XcodeDefault.xctoolchain/usr/lib"
          test -f "$dir/libclang.dylib"
          echo "LIBCLANG_PATH=$dir" >> "$GITHUB_ENV"
      - run: npm ci --no-audit --no-fund
      - name: Version
        id: version
        run: |
          version=$(node -p "require('./package.json').version")
          conf=$(node -p "require('./src-tauri/tauri.conf.json').version")
          test "$version" = "$conf" || { echo "package.json $version != tauri.conf.json $conf"; exit 1; }
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - name: Release tag matches the version
        if: github.event_name == 'release'
        run: test "${{ github.event.release.tag_name }}" = "v${{ steps.version.outputs.version }}"
      - run: npm run typecheck
      - run: npx vitest run
      # The shell embeds the built frontend at compile time.
      - run: npm run build
      # sherpa-onnx's pinned, hash-checked no-TTS libraries (SHERPA_ONNX_LIB_DIR) for tuldmi-speakers.
      - run: node scripts/sherpa-libs.mjs
      - run: cargo clippy --locked --workspace --all-targets -- -D warnings
      - run: cargo test --locked -p tuldmi-engine -p tuldmi -p tuldmi-mcp -p tuldmi-speakers
      - name: Bundle (app + dmg, ad-hoc signed, with tuldmi-mcp and tuldmi-speakers)
        run: |
          node scripts/build-sidecars.mjs aarch64-apple-darwin
          npx tauri build --target aarch64-apple-darwin --bundles app,dmg --config src-tauri/tauri.bundle.conf.json
      - name: Verify bundle
        run: |
          set -euo pipefail
          v=${{ steps.version.outputs.version }}
          app=target/aarch64-apple-darwin/release/bundle/macos/tuldMi.app
          dmg=target/aarch64-apple-darwin/release/bundle/dmg/tuldMi_${v}_aarch64.dmg
          test -d "$app" && test -f "$dmg"
          codesign --verify --deep --strict --verbose=2 "$app"
          codesign -d --verbose=2 "$app" 2>&1 | grep -E '^CodeDirectory .*flags=.*runtime'
          codesign -d --entitlements - --xml "$app" > entitlements.plist
          test "$(/usr/libexec/PlistBuddy -c 'Print :com.apple.security.device.audio-input' entitlements.plist)" = true
          plutil -extract NSMicrophoneUsageDescription raw "$app/Contents/Info.plist"
          plutil -extract NSAudioCaptureUsageDescription raw "$app/Contents/Info.plist"
          test "$(plutil -extract LSMinimumSystemVersion raw "$app/Contents/Info.plist")" = 15.4
          test "$(plutil -extract CFBundleShortVersionString raw "$app/Contents/Info.plist")" = "$v"
          test -f "$app/Contents/Resources/ggml-silero-v6.2.0.bin"
          test -f "$app/Contents/Resources/ced-tiny-audioset.int8.onnx"
          test -f "$app/Contents/Resources/audioset-labels.csv"
          # Third-party license texts ship with the app (Apache-2.0 §4, MIT, BSD).
          for f in README.txt THIRD_PARTY_NOTICES.md third-party-licenses.txt Apache-2.0.txt onnxruntime-ThirdPartyNotices.txt hclust-cpp-LICENSE.txt darts-clone-LICENSE.txt whisper.cpp-LICENSE.txt; do
            test -s "$app/Contents/Resources/licenses/$f"
          done
          exe="$app/Contents/MacOS/$(plutil -extract CFBundleExecutable raw "$app/Contents/Info.plist")"
          lipo -archs "$exe" | grep -qx arm64
          # tuldmi-mcp finds the app as its sibling `tuldmi`, and must run on its own.
          test "$(basename "$exe")" = tuldmi
          mcp="$app/Contents/MacOS/tuldmi-mcp"
          test -x "$mcp"
          lipo -archs "$mcp" | grep -qx arm64
          codesign --verify --strict --verbose=2 "$mcp"
          test "$("$mcp" --version)" = "tuldmi-mcp $v"
          if otool -L "$mcp" | tail -n +2 | grep -v -E '^\s+(/System/Library/|/usr/lib/)'; then
            echo "tuldmi-mcp links a non-system library"; exit 1
          fi
          # The speaker worker (sherpa-onnx, statically linked, no TTS/espeak-ng).
          spk="$app/Contents/MacOS/tuldmi-speakers"
          test -x "$spk"
          lipo -archs "$spk" | grep -qx arm64
          codesign --verify --strict --verbose=2 "$spk"
          test "$("$spk" --version)" = "tuldmi-speakers $v"
          if otool -L "$spk" | tail -n +2 | grep -v -E '^\s+(/System/Library/|/usr/lib/)'; then
            echo "tuldmi-speakers links a non-system library"; exit 1
          fi
          # Search the binary itself: release builds are stripped (nm sees nothing), and
          # `nm | grep -q` under pipefail reads a match as a SIGPIPE failure.
          if grep -a -c espeak_ng "$spk" > /dev/null; then
            echo "tuldmi-speakers contains espeak-ng (GPL): use the no-TTS sherpa-onnx libraries"; exit 1
          fi
          mkdir -p dist
          otool -L "$exe" | tee dist/macos-linked-libraries.txt
          # Only system libraries: everything else must be statically linked.
          # (`! cmd` never trips `set -e`, so test explicitly.)
          if tail -n +2 dist/macos-linked-libraries.txt | grep -v -E '^\s+(/System/Library/|/usr/lib/)'; then
            echo "non-system library linked"; exit 1
          fi
          # Asking a tuldMi that isn't running to pause exits 3 (PAUSE_NOT_RUNNING) at once.
          set +e; "$exe" --pause; code=$?; set -e
          test "$code" = 3 || { echo "tuldmi --pause with nothing running exited $code"; exit 1; }
          # Launch the bundled app for real: setup must get all the way through ("tuldMi ready",
          # logged last). A config that lets Tauri build the main window too fails setup early.
          logs="$HOME/Library/Application Support/com.spillerstech.tuldmi/logs"
          rm -rf "$logs"
          "$exe" > launch.log 2>&1 &
          pid=$!
          started=""
          for _ in $(seq 1 90); do
            sleep 1
            kill -0 "$pid" 2>/dev/null || { echo "tuldMi exited during startup:"; cat launch.log; exit 1; }
            if grep -qs "tuldMi ready" "$logs/"tuldmi.log*; then started=1; break; fi
          done
          test -n "$started" || { echo "tuldMi never finished starting:"; cat launch.log; cat "$logs/"tuldmi.log* 2>/dev/null || true; exit 1; }
          sleep 5
          kill -0 "$pid" 2>/dev/null || { echo "tuldMi exited after starting:"; cat launch.log; exit 1; }
          kill "$pid" 2>/dev/null || true; wait "$pid" 2>/dev/null || true
          hdiutil verify "$dmg"
          cp "$dmg" dist/
          (cd dist && shasum -a 256 "tuldMi_${v}_aarch64.dmg" > "tuldMi_${v}_aarch64.dmg.sha256" && cat ./*.sha256)
      - uses: actions/upload-artifact@v4
        with:
          name: tuldMi-macos-arm64
          # One directory, so the artifact's root is dist/ itself (publish downloads it into dist).
          path: dist/
          if-no-files-found: error
          retention-days: 14

  publish:
    name: Attach disk image to the release
    if: github.event_name == 'release'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: tuldMi-macos-arm64
          path: dist
      - name: Upload
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.release.tag_name }}
        run: |
          set -euo pipefail
          cd dist
          shasum -a 256 -c ./*.sha256
          gh release upload "$TAG" ./*.dmg ./*.sha256 --clobber --repo "$GITHUB_REPOSITORY"
