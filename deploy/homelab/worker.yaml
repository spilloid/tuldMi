apiVersion: v1
kind: Namespace
metadata:
  name: tuldmi
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: tuldmi-models
spec:
  accessModes: [ReadWriteOnce]
  storageClassName: longhorn
  resources:
    requests:
      storage: 2Gi
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: tuldmi-library
spec:
  accessModes: [ReadWriteOnce]
  storageClassName: longhorn-critical
  resources:
    requests:
      storage: 20Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: tuldmi
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: tuldmi
  template:
    metadata:
      labels:
        app: tuldmi
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: worker
          image: ghcr.io/spilloid/tuldmi-worker@sha256:b31f339519a9206eadedb01954456854a941661cfca39a5d05787a0fabf53f22
          ports:
            - name: http
              containerPort: 8080
          env:
            - name: TULDMI_LIBRARY_RETENTION_DAYS
              value: "0"
            - name: TULDMI_LIBRARY_DIR
              value: /library
            - name: TULDMI_MODEL
              value: base.en
            - name: TULDMI_CPU_THREADS
              value: "4"
            - name: TULDMI_CONCURRENCY
              value: "1"
            - name: TULDMI_OIDC_ISSUER
              value: https://auth.spillerstech.us/application/o/tuldmi/
            - name: TULDMI_OIDC_AUDIENCE
              value: tuldmi-desktop
            - name: TULDMI_OIDC_JWKS
              value: https://auth.spillerstech.us/application/o/tuldmi/jwks/
          resources:
            requests:
              cpu: "2"
              memory: 512Mi
            limits:
              cpu: "4"
              memory: 2Gi
          startupProbe:
            httpGet:
              path: /readyz
              port: http
            periodSeconds: 10
            failureThreshold: 90
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          volumeMounts:
            - name: library
              mountPath: /library
            - name: models
              mountPath: /models
            - name: temporary
              mountPath: /tmp
      volumes:
        - name: library
          persistentVolumeClaim:
            claimName: tuldmi-library
        - name: models
          persistentVolumeClaim:
            claimName: tuldmi-models
        - name: temporary
          emptyDir:
            medium: Memory
            sizeLimit: 64Mi
---
apiVersion: v1
kind: Service
metadata:
  name: tuldmi
spec:
  selector:
    app: tuldmi
  ports:
    - name: http
      port: 8080
      targetPort: http
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: tuldmi
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-cloudflare
    nginx.ingress.kubernetes.io/enable-access-log: "false"
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
    nginx.ingress.kubernetes.io/proxy-body-size: 10m
    nginx.ingress.kubernetes.io/proxy-read-timeout: "130"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "130"
    # The API verifies Authentik JWTs itself. Browser forward-auth redirects break uploads.
spec:
  ingressClassName: nginx
  tls:
    - hosts: [tuldmi.spillerstech.us]
      secretName: tuldmi-spillerstech-us-tls
  rules:
    - host: tuldmi.spillerstech.us
      http:
        paths:
          - path: /v1/library
            pathType: Prefix
            backend:
              service:
                name: tuldmi
                port:
                  number: 8080
          - path: /v1/audio/transcriptions
            pathType: Exact
            backend:
              service:
                name: tuldmi
                port:
                  number: 8080
