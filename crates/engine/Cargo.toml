[package]
name = "tuldmi-engine"
description = "tuldMi capture, speech segmentation, persistence and transcription engine"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[features]
default = ["whisper"]
# whisper.cpp transcription + Silero VAD (ggml). Off => energy VAD only and no transcription
# backend, which keeps `cargo test` fast for pure-logic work.
whisper = ["dep:whisper-rs"]

[dependencies]
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tracing.workspace = true
uuid.workspace = true
cpal = "0.18"
rubato = "5"
rusqlite = { version = "0.40", features = ["bundled"] }
opus = "0.4"
ogg = "0.9"
crossbeam-channel = "0.5"
parking_lot = "0.12"
sha2 = "0.10"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "rustls-tls"] }
whisper-rs = { version = "0.16", optional = true }
fs4 = "0.13"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }

[dev-dependencies]
tempfile = "3"
hound = "3"
