[workspace]
resolver = "3"
members = ["crates/engine", "crates/mcp", "src-tauri"]

[workspace.package]
version = "0.3.0"
edition = "2024"
license = "MIT"
repository = "https://github.com/spilloid/tuldMi"
publish = false

[workspace.dependencies]
tuldmi-engine = { path = "crates/engine" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tracing = "0.1"
uuid = { version = "1", features = ["v4", "v7", "serde"] }

[profile.dev.package."*"]
opt-level = 2

# whisper-rs-sys builds with `--config Release` but, when its build script has debug assertions,
# declares CMAKE_BUILD_TYPE=RelWithDebInfo; cmake-rs then puts the C-runtime flag (-MT under
# crt-static, see .cargo/config.toml) only into the RelWithDebInfo flags, and whisper.cpp builds
# /MD and fails to link on Windows. Build scripts without debug assertions keep the two aligned.
[profile.dev.build-override]
debug-assertions = false

[profile.release]
lto = "thin"
codegen-units = 4
strip = true
