[workspace]
resolver = "3"
members = ["crates/engine", "src-tauri"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"
repository = "https://github.com/spilloid/tuldMi"
publish = false

[workspace.dependencies]
tuldmi-engine = { path = "crates/engine" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tracing = "0.1"
uuid = { version = "1", features = ["v4", "v7", "serde"] }

[profile.dev.package."*"]
opt-level = 2

[profile.release]
lto = "thin"
codegen-units = 4
strip = true
